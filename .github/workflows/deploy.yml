name: Deploy site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info

      - name: Build static site
        run: |
          cp -R site public
          mkdir -p public/assets
          cp "content/Images/robosoccer.png" public/assets/robosoccer.png
          cp "content/Images/image-removebg-preview (2) 1.png" public/assets/wheel-legged.png
          cp "content/Images/Pasted image 20241129143709.png" public/assets/robotic-arm.png
          cp "content/Images/harmonic.png" public/assets/harmonic.png
          cp "content/Images/harmonic parts.png" public/assets/harmonic-parts.png

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
